<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deoro counter</title>
    <script src="vendor/html5-qrcode.min.js"></script>
    <style>
      :root {
        --bg: #1a120e;
        --card: rgb(42, 28, 20);
        --ink: rgb(245, 230, 196);
        --label: rgb(212, 175, 106);
        --miss: #ffb4a2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        background: radial-gradient(circle at top, #3a2418, var(--bg));
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px 64px;
      }
      h1 { font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; opacity: 0.7; }
      .hint { max-width: 420px; text-align: center; font-size: 13px; opacity: 0.7; margin: 0 0 20px; line-height: 1.45; }
      .hint a { color: var(--label); }
      .panel {
        width: min(420px, 100%);
        background: var(--card);
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      .label { font-size: 10px; letter-spacing: 0.12em; color: var(--label); text-transform: uppercase; }
      input[type="text"] {
        width: 100%;
        margin: 8px 0 12px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(212, 175, 106, 0.4);
        background: #2a1c14;
        color: var(--ink);
        font-size: 16px;
        letter-spacing: 0.06em;
      }
      button, .file {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--label);
        border-radius: 999px;
        padding: 10px 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
        cursor: pointer;
      }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      #reader { width: 100%; margin: 14px 0; min-height: 0; }
      #reader:empty { display: none; }
      .result { margin-top: 20px; }
      .result h2 { margin: 0 0 12px; font-size: 20px; }
      .kv { margin-bottom: 12px; }
      .kv .value { font-size: 22px; font-weight: 600; }
      .miss { color: var(--miss); }
      .ok { color: var(--ink); }
      .nav { margin-top: 22px; font-size: 13px; }
      .nav a { color: var(--label); }
    </style>
  </head>
  <body>
    <h1>Deoro · Counter</h1>
    <p class="hint">
      Happy path: open the <a href="../preview/">Wallet preview</a>, hold its QR to this camera,
      or paste the serial <code>DEORO-10001</code>. Lookup uses the same <code>pass.json</code> — not a second member list.
    </p>
    <div class="panel">
      <div class="label">Member serial</div>
      <form id="paste-form">
        <input id="serial" type="text" inputmode="text" autocomplete="off" placeholder="DEORO-10001" />
        <div class="row">
          <button type="submit">Look up</button>
          <button type="button" id="cam">Start camera</button>
          <label class="file">
            Scan image
            <input id="file" type="file" accept="image/*" hidden />
          </label>
        </div>
      </form>
      <div id="reader"></div>
      <div class="result" id="result" hidden></div>
    </div>
    <p class="nav"><a href="../preview/">← Wallet preview</a></p>
    <script>
      const PASS_URL = "../pass/Deoro%20Loyalty.pass/pass.json";
      const SERIAL_RE = /^DEORO-\d+$/;

      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }

      function field(card, bucket, key) {
        return (card[bucket] ?? []).find((f) => f.key === key);
      }

      function normalize(raw) {
        return String(raw ?? "").trim().toUpperCase();
      }

      function show(html) {
        const el = document.getElementById("result");
        el.hidden = false;
        el.innerHTML = html;
      }

      function miss(serial, reason) {
        show(
          `<div class="miss">
            <h2>No member found</h2>
            <p>${esc(reason)}</p>
            <div class="kv"><div class="label">Scanned</div><div class="value">${esc(serial || "—")}</div></div>
          </div>`
        );
      }

      function found(member) {
        show(
          `<div class="ok">
            <h2>${esc(member.name)}</h2>
            <div class="kv"><div class="label">Serial</div><div class="value">${esc(member.serial)}</div></div>
            <div class="kv"><div class="label">Stamps</div><div class="value">${esc(member.stamps)}</div></div>
            <div class="kv"><div class="label">Member</div><div class="value">${esc(member.member)}</div></div>
          </div>`
        );
      }

      async function lookup(raw) {
        const serial = normalize(raw);
        if (!serial) {
          miss("", "Enter or scan a serial like DEORO-10001.");
          return;
        }
        if (!SERIAL_RE.test(serial)) {
          miss(serial, "Serial should look like DEORO-10001.");
          return;
        }
        let pass;
        try {
          const res = await fetch(`${PASS_URL}?t=${Date.now()}`, { cache: "no-store" });
          if (!res.ok) throw new Error("Could not load pass.json — serve this folder over HTTP.");
          pass = await res.json();
        } catch (e) {
          miss(serial, e.message);
          return;
        }
        if (normalize(pass.serialNumber) !== serial) {
          miss(serial, `No member for ${serial}.`);
          return;
        }
        const card = pass.storeCard ?? {};
        found({
          serial: pass.serialNumber,
          name: field(card, "auxiliaryFields", "name")?.value ?? "—",
          stamps: field(card, "primaryFields", "stamps")?.value ?? "—",
          member: field(card, "headerFields", "member")?.value ?? "—",
        });
      }

      document.getElementById("paste-form").addEventListener("submit", (e) => {
        e.preventDefault();
        lookup(document.getElementById("serial").value);
      });

      let scanner = null;
      const camBtn = document.getElementById("cam");

      async function stopCamera() {
        if (!scanner) return;
        try {
          await scanner.stop();
        } catch (_) {
          /* already stopped */
        }
        try {
          scanner.clear();
        } catch (_) {
          /* ignore */
        }
        scanner = null;
        camBtn.textContent = "Start camera";
      }

      async function onScan(text) {
        document.getElementById("serial").value = normalize(text);
        await stopCamera();
        lookup(text);
      }

      camBtn.addEventListener("click", async () => {
        if (scanner) {
          await stopCamera();
          return;
        }
        scanner = new Html5Qrcode("reader");
        camBtn.textContent = "Stop camera";
        try {
          await scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            onScan
          );
        } catch (e) {
          await stopCamera();
          miss("", "Camera could not start. Paste the serial or scan an image instead.");
        }
      });

      document.getElementById("file").addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        const tmp = new Html5Qrcode("reader");
        try {
          const text = await tmp.scanFile(file, true);
          document.getElementById("serial").value = normalize(text);
          lookup(text);
        } catch (_) {
          miss("", "Could not read a QR from that image. Try the preview QR or paste DEORO-10001.");
        } finally {
          try {
            tmp.clear();
          } catch (_) {
            /* ignore */
          }
        }
      });
    </script>
  </body>
</html>
